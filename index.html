<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinais Ocultos — Reflexão sobre Relacionamentos</title>
<meta name="description" content="Sinais Ocultos: testes de reflexão sobre relacionamentos com resultados personalizados, gráficos e dicas. Privacidade em primeiro lugar.">
<style>
:root{
  --bg:#0a0a0c; --bg2:#101014; --card:#141418; --card2:#1a151c;
  --red:#a81c2e; --red-dark:#7a1220; --pink:#ff5f8f; --pink-soft:#ff8fb0;
  --white:#f5f2f4; --muted:#b8aeb5; --line:rgba(255,95,143,.16);
  --ok:#2fbf71; --err:#ff5f6d;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
  linear-gradient(rgba(10,10,12,.78), rgba(10,10,12,.88)),
  url("Romance Carmesim sobre Fundo Sombrio.png") center center / cover no-repeat fixed;
  color:var(--white); min-height:100vh; line-height:1.6;
}
a{color:var(--pink-soft)}
.wrap{max-width:1020px;margin:0 auto;padding:26px 18px 120px}
h1{font-size:clamp(1.8rem,5.5vw,2.7rem);line-height:1.15;font-weight:800}
h1 .accent,h2 .accent{background:linear-gradient(120deg,var(--red),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(1.35rem,4vw,1.9rem);font-weight:800;margin-bottom:8px}
.sub{color:var(--muted);max-width:620px}
.section{margin-top:44px}

/* ===== Header / Menu ===== */
header.site{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:rgba(10,10,12,.86);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;position:relative}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white);font-weight:800;letter-spacing:.06em}
.logo svg{filter:drop-shadow(0 0 8px rgba(255,95,143,.6))}
.logo small{display:block;font-size:.62rem;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-weight:600}
nav.menu{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
nav.menu a{color:var(--muted);text-decoration:none;padding:9px 13px;border-radius:10px;font-weight:600;font-size:.9rem;white-space:nowrap;transition:.15s}
nav.menu a:hover,nav.menu a.active{color:#fff;background:rgba(255,95,143,.12)}
nav.menu a.btn-wa{background:linear-gradient(120deg,#1f9e54,#2fd071);color:#fff;margin-left:6px}
.hamburger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer}
.hamburger span{display:block;width:22px;height:2px;background:var(--white);margin:5px 0;border-radius:2px}
@media(max-width:960px){
  .hamburger{display:block}
  nav.menu{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:#14101a;border-bottom:1px solid var(--line);padding:12px;gap:4px}
  nav.menu.open{display:flex}
  nav.menu a{padding:13px 16px}
}

/* ===== Cards ===== */
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4.5vw,34px);box-shadow:0 18px 50px rgba(0,0,0,.4)}
.card h2{margin-bottom:12px}
.grid{display:grid;gap:16px}
.grid.cols-2{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tile{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:22px;transition:.2s;text-decoration:none;color:var(--white);display:block}
.tile:hover{transform:translateY(-4px);border-color:rgba(255,95,143,.5);box-shadow:0 14px 34px rgba(168,28,46,.25)}
.tile .tag{display:inline-block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:800;margin-bottom:8px}
.tile p{color:var(--muted);font-size:.9rem;margin-top:6px}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;font:inherit;font-weight:700;border-radius:13px;padding:14px 24px;font-size:.98rem;text-decoration:none;width:100%;transition:.15s;color:var(--white)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(120deg,var(--red),var(--pink));box-shadow:0 10px 26px rgba(168,28,46,.35);color:#fff}
.btn-primary:hover{box-shadow:0 12px 32px rgba(255,95,143,.4)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,.15)}
.btn-ghost:hover{color:#fff;border-color:rgba(255,255,255,.32)}
.btn-whatsapp{background:#1f9e54;color:#fff}
.btn-whatsapp:hover{background:#23b361}
.btn-share{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)}
.btn-danger{background:rgba(255,95,109,.12);border:1px solid rgba(255,95,109,.4);color:#ff8f9a}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:10px 16px;font-size:.88rem;width:auto}

/* ===== Forms ===== */
.field{margin-bottom:16px}
.field label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:inherit;color:var(--white);background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.13);border-radius:12px;padding:14px 16px;transition:.15s}
.field input:focus{outline:none;border-color:var(--pink);background:rgba(255,95,143,.06)}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:5px}
.field .err-msg{font-size:.8rem;color:var(--err);margin-top:5px;display:none}
.field.invalid input{border-color:var(--err)}
.field.invalid .err-msg{display:block}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:52px}
.pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:8px;font-size:1.05rem}
.checkline{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:.86rem;color:var(--muted)}
.checkline input{margin-top:4px;accent-color:var(--pink)}
.alert{border-radius:12px;padding:13px 16px;font-size:.9rem;margin:14px 0;display:none}
.alert.show{display:block}
.alert-ok{background:rgba(47,191,113,.12);border:1px solid rgba(47,191,113,.4);color:#9fe8c0}
.alert-err{background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.4);color:#ffb3ba}
.alert-info{background:rgba(255,95,143,.08);border:1px solid var(--line);color:var(--pink-soft)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem;margin:22px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}

/* ===== Quiz ===== */
.progress-meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;gap:6px}
.progress-track{height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--red),var(--pink));transition:width .45s cubic-bezier(.4,0,.2,1)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.dots button{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:transparent;cursor:pointer;padding:0;transition:.15s}
.dots button.done{background:var(--pink);border-color:var(--pink)}
.dots button.current{box-shadow:0 0 0 3px rgba(255,95,143,.35);border-color:var(--pink)}
.q-cat{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--pink);font-weight:800;margin-bottom:8px}
.q-text{font-size:clamp(1.1rem,4.2vw,1.35rem);font-weight:700;line-height:1.4;margin-bottom:22px}
.options{display:grid;gap:11px}
.option{width:100%;text-align:left;font:inherit;font-size:.97rem;font-weight:600;color:var(--white);background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);border-radius:13px;padding:16px 16px 16px 50px;cursor:pointer;position:relative;min-height:54px;transition:.15s}
.option:hover{border-color:rgba(255,95,143,.5);background:rgba(255,95,143,.06)}
.option .check{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:21px;height:21px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transition:.15s}
.option.selected{border-color:var(--pink);background:rgba(255,95,143,.12)}
.option.selected .check{border-color:var(--pink);background:var(--pink);box-shadow:inset 0 0 0 4px var(--pink)}
.nav-row{display:flex;gap:12px;margin-top:26px}
.nav-row .btn{flex:1}

/* ===== Result ===== */
.result-hero{text-align:center}
.score-big{font-size:clamp(2.8rem,13vw,4.4rem);font-weight:800;line-height:1;background:linear-gradient(120deg,var(--red),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.band-badge{display:inline-block;margin:16px 0 4px;padding:10px 22px;border-radius:99px;background:rgba(168,28,46,.18);border:1px solid rgba(255,95,143,.35);color:var(--pink-soft);font-weight:800;font-size:.95rem}
.disclaimer{font-size:.85rem;color:var(--muted);background:rgba(255,255,255,.04);border-left:3px solid var(--pink);border-radius:8px;padding:12px 14px;margin:18px 0}
.safety{background:rgba(255,95,109,.1);border:1px solid rgba(255,95,109,.45);border-radius:12px;padding:14px 16px;font-size:.9rem;color:#ffc9ce;margin:18px 0}
.res-sec{margin-top:26px}
.res-sec h3{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pink);font-weight:800;margin-bottom:14px}
.chart-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.chart-box canvas{max-width:100%}
.legend{font-size:.78rem;color:var(--muted);margin-top:10px}
.olist{list-style:none;display:grid;gap:10px}
.olist li{display:flex;gap:12px;background:rgba(255,95,143,.05);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:.92rem}
.olist .n{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,var(--red),var(--pink));font-weight:800;font-size:.8rem}
.plist{list-style:none;display:grid;gap:8px}
.plist li{background:rgba(47,191,113,.06);border:1px solid rgba(47,191,113,.25);border-radius:10px;padding:10px 14px;font-size:.9rem}
ul.tick{padding-left:2px;list-style:none;display:grid;gap:8px}
ul.tick li{padding-left:26px;position:relative;font-size:.93rem;color:#e6dfe4}
ul.tick li::before{content:"";position:absolute;left:2px;top:8px;width:12px;height:12px;border-radius:50%;background:linear-gradient(120deg,var(--red),var(--pink))}
.actions-grid{display:grid;gap:10px;margin-top:30px}
.chart-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* ===== Account ===== */
.profile-row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:.93rem}
.profile-row span:first-child{color:var(--muted)}
.hist-item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.hist-item .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.hist-item small{color:var(--muted)}
.badge{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:rgba(255,95,143,.12);border:1px solid var(--line);color:var(--pink-soft)}

/* ===== Modal / toast ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:420px;width:100%;animation:fadeIn .25s ease both}
.modal h3{margin-bottom:10px}
.modal p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
.modal .row{display:flex;gap:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#221a20;border:1px solid var(--line);padding:12px 22px;border-radius:99px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Floating WhatsApp ===== */
.wa-float{position:fixed;right:18px;bottom:18px;z-index:50;width:58px;height:58px;border-radius:50%;background:#22c05c;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(34,192,92,.45);transition:.15s;animation:waPulse 2.6s infinite}
.wa-float:hover{transform:scale(1.08)}
@keyframes waPulse{0%{box-shadow:0 10px 28px rgba(34,192,92,.45),0 0 0 0 rgba(34,192,92,.4)}70%{box-shadow:0 10px 28px rgba(34,192,92,.45),0 0 0 16px rgba(34,192,92,0)}100%{box-shadow:0 10px 28px rgba(34,192,92,.45),0 0 0 0 rgba(34,192,92,0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.screen-anim{animation:fadeIn .4s ease both}
footer{border-top:1px solid var(--line);margin-top:60px;padding:28px 18px;text-align:center;color:var(--muted);font-size:.8rem}
.steps{counter-reset:step;display:grid;gap:14px}
.step{position:relative;padding:16px 16px 16px 60px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;font-size:.93rem;color:#e6dfe4}
.step::before{counter-increment:step;content:counter(step);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;background:linear-gradient(120deg,var(--red),var(--pink));display:flex;align-items:center;justify-content:center;font-weight:800}
.setup-box{background:rgba(255,159,67,.07);border:1px solid rgba(255,159,67,.35);border-radius:12px;padding:14px 16px;font-size:.85rem;color:#ffd9ad;margin:14px 0}
.setup-box code{background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px;font-size:.8rem}
@media(max-width:560px){.nav-row{flex-direction:column}.btn{padding:15px 20px}}
@media print{header.site,.wa-float,.toast,.actions-grid,.chart-actions{display:none!important}body{background:#fff;color:#000}}
.logo img {
  height: 50px;
  width: auto;
  object-fit: contain;
  display: block;
}</style>
</head>

<script>
/* ============================================================
   SINAIS OCULTOS — plataforma de reflexão sobre relacionamentos
   ============================================================ */
"use strict";

/* ---------- CONFIGURAÇÃO (integrações externas) ---------- */
var CONFIG = {

  whatsappMsg: "Ol%C3%A1%21%20Quero%20saber%20mais%20sobre%20o%20Sinais%20Ocultos."

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(iso){ try{ return new Date(iso).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}); }catch(e){ return iso; } }

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove("show"); },2800);
}

var _modalCb=null;
function confirmModal(title,text,okLabel,cb){

$("modal-ok").addEventListener("click",function(){ $("modal-bg").classList.remove("open"); if(_modalCb){ var cb=_modalCb; _modalCb=null; cb(); } });

/* ============================================================
   DADOS — TESTE PRINCIPAL (30 perguntas / 8 categorias)

   2 últimas com 3 perguntas (total 30, balanceado).
   v = pontuação da alternativa (0 a 3). Maior = mais preocupação.
   Perguntas positivas e negativas misturadas para reduzir viés.

];

/* ============================================================
   QUIZ
   ============================================================ */
function startQuiz(testId){
  var test = getTest(testId);
  if (!test){ location.hash = "#/testes"; return; }
  if (quiz.testId !== testId || quiz.answers.every(function(a){ return a !== null; })){
    quiz = { testId:testId, answers:new Array(test.questions.length).fill(null), current:0 };
  }
  renderQuiz();
}

function renderQuiz(){
  var test = getTest(quiz.testId);
  var total = test.questions.length;
  var i = quiz.current;
  var q = test.questions[i];
  var catName = quiz.testId === "principal" ? CATS[q.c].name : test.cats[q.c];
  charts.forEach(function(c){ try{ c.destroy(); }catch(e){} }); charts = [];

  var dots = "";
  for (var k = 0; k < total; k++){
    dots += '<button type="button" data-dot="' + k + '" class="' +
      (quiz.answers[k] !== null ? "done" : "") + (k === i ? " current" : "") +
      '" aria-label="Ir para pergunta ' + (k+1) + '"></button>';
  }

  var opts = "";
  q.o.forEach(function(pair, idx){
    opts += '<button type="button" class="option' + (quiz.answers[i] === idx ? " selected" : "") + '" data-opt="' + idx + '"><span class="check"></span><span>' + esc(pair[0]) + '</span></button>';
  });

  var isLast = (i === total - 1);
  app.innerHTML = "";
  var el = document.createElement("div"); el.className = "screen-anim";
  el.innerHTML =
  '<section class="section" style="margin-top:14px"><div class="card">' +
    '<div class="progress-meta"><span>Pergunta ' + (i+1) + ' de ' + total + '</span><span>' + esc(catName) + '</span></div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + (i/total*100) + '%"></div></div>' +
    '<div class="dots">' + dots + '</div>' +
    '<div class="q-text">' + esc(q.q) + '</div>' +
    '<div class="options">' + opts + '</div>' +
    '<div class="nav-row">' +
      '<button class="btn btn-ghost" id="q-prev"' + (i === 0 ? " disabled" : "") + '>Voltar</button>' +
      '<button class="btn btn-primary" id="q-next"' + (quiz.answers[i] === null ? " disabled" : "") + '>' + (isLast ? "Ver meu resultado" : "Próxima pergunta") + '</button>' +
    '</div>' +
    '<div style="text-align:center;margin-top:16px"><button class="btn btn-ghost btn-sm" id="q-restart">Reiniciar teste</button></div>' +
  '</div></section>';
  app.appendChild(el);

  el.querySelectorAll("[data-opt]").forEach(function(b){
    b.addEventListener("click", function(){
      quiz.answers[i] = parseInt(b.getAttribute("data-opt"), 10);
      el.querySelectorAll(".option").forEach(function(x){ x.classList.remove("selected"); });
      b.classList.add("selected");
      $("q-next").disabled = false;
      var dot = el.querySelector('[data-dot="' + i + '"]');
      if (dot) dot.classList.add("done");
    });
  });
  el.querySelectorAll("[data-dot]").forEach(function(b){
    b.addEventListener("click", function(){
      quiz.current = parseInt(b.getAttribute("data-dot"), 10);
      renderQuiz();
    });
  });
  var prev = $("q-prev");
  if (prev) prev.addEventListener("click", function(){ if (quiz.current > 0){ quiz.current--; renderQuiz(); } });
  $("q-next").addEventListener("click", function(){
    if (quiz.answers[quiz.current] === null) return; // impede avançar sem responder
    if (!isLast){ quiz.current++; renderQuiz(); }
    else { finishQuiz(); }
  });
  $("q-restart").addEventListener("click", function(){
    confirmModal("Reiniciar teste?", "Suas respostas já preenchidas serão descartadas. Essa ação não pode ser desfeita.", "Reiniciar", function(){
      quiz.answers = new Array(test.questions.length).fill(null);
      quiz.current = 0; renderQuiz();
    });
  });
}

/* ============================================================
   CÁLCULO DO RESULTADO
   ============================================================ */
function catList(test){
  return test.cats.map(function(id, idx){
    var def = CATS.filter(function(c){ return c.id === id; })[0];
    var name = def ? def.name : test.cats[idx];
    var qs = [];
    test.questions.forEach(function(q, i){ if (q.c === idx) qs.push(i); });
    return { idx:idx, id:id, name:name, qs:qs };
  });
}

function computeResult(test, answers){
  var cats = catList(test).map(function(c){
    var score = c.qs.reduce(function(s, qi){ return s + test.questions[qi].o[answers[qi]][1]; }, 0);
    var max = c.qs.length * 3;
    return { id:c.id, name:c.name, score:score, max:max, pct:max > 0 ? Math.round(score/max*100) : null };
  });
  var total = cats.reduce(function(s,c){ return s + c.score; }, 0);
  var totalMax = cats.reduce(function(s,c){ return s + c.max; }, 0);

  var band = null;
  test.bands.forEach(function(b){ if (total >= b.min && total <= b.max) band = b; });
  if (!band) band = test.bands[test.bands.length-1];

  // segurança: pergunta(s) marcadas como safety com resposta de alto risco
  var safety = test.questions.some(function(q, i){ return q.safety && test.questions[i].o[answers[i]][1] >= 2; });

  // ordenação de categorias por percentual
  var sorted = cats.slice().sort(function(a,b){ return (b.pct||0) - (a.pct||0); });

  // 5 dicas personalizadas (só o que as respostas justificam)
  var tips = [];
  sorted.forEach(function(c){ if (tips.length < 4 && c.pct !== null && c.pct >= 50 && TIPS[c.id]) tips.push(TIPS[c.id]); });
  ["geral1","geral2","geral3","geral4","geral5"].forEach(function(g){ if (tips.length < 5 && tips.indexOf(TIPS[g]) === -1) tips.push(TIPS[g]); });
  tips = tips.slice(0,5);

  // 3 perguntas para reflexão
  var refl = [];
  sorted.forEach(function(c){ if (refl.length < 2 && c.pct !== null && c.pct >= 34 && REFLECT[c.id]) refl.push(REFLECT[c.id]); });
  ["geral1","geral2"].forEach(function(g){ if (refl.length < 3 && refl.indexOf(REFLECT[g]) === -1) refl.push(REFLECT[g]); });
  refl = refl.slice(0,3);

  // pontos positivos e aspectos de reflexão
  var positives = sorted.filter(function(c){ return c.pct !== null && c.pct < 34; })
    .map(function(c){ return c.name; });
  var concerns = sorted.filter(function(c){ return c.pct !== null && c.pct >= 50; });

  return { total:total, totalMax:totalMax, band:band, cats:cats, sorted:sorted,
           safety:safety, tips:tips, refl:refl, positives:positives, concerns:concerns,
           dateISO:new Date().toISOString() };
}

function interpLabel(pct){
  if (pct === null) return "Sem dados";
  if (pct < 34) return "poucas preocupações relatadas";
  if (pct < 67) return "alguns aspectos podem merecer conversa e reflexão";
  return "maior quantidade de preocupações relatadas";
}

/* ============================================================
   TELA DE RESULTADO
   ============================================================ */
function finishQuiz(){
  var test = getTest(quiz.testId);
  var result = computeResult(test, quiz.answers);
  LAST = { testId:quiz.testId, test:test, result:result, answers:quiz.answers.slice() };
  renderResult(LAST);
}

/* ---------- gráficos ---------- */

function drawCharts(r, hasData, doughnutOK){
  if (typeof Chart === "undefined"){
    // fallback sem CDN: barras em CSS
    var box = $("chart-bar").parentElement;
    $("chart-bar").style.display = "none";
    var fb = document.createElement("div"); fb.className = "chart-fallback";
    r.cats.forEach(function(c, i){
      var row = document.createElement("div");
      row.innerHTML = '<div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:4px"><span>' + esc(c.name) + '</span><span style="color:var(--muted)">' + (c.pct === null ? "Sem dados" : c.score + "/" + c.max + " · " + c.pct + "%") + '</span></div>' +
        '<div style="height:12px;background:rgba(255,255,255,.07);border-radius:99px"><div style="height:100%;width:' + (c.pct||0) + '%;border-radius:99px;background:' + PALETTE[i % PALETTE.length] + '"></div></div>';
      row.style.marginBottom = "14px";
      fb.appendChild(row);
    });
    box.insertBefore(fb, box.firstChild);
    return;
  }
  Chart.defaults.color = "#b8aeb5";
  Chart.defaults.font.family = "'Segoe UI',system-ui,sans-serif";

  var labels = [], vals = [], maxs = [], colors = [];
  r.cats.forEach(function(c, i){
    labels.push(c.name); colors.push(PALETTE[i % PALETTE.length]);
    vals.push(c.score); maxs.push(c.max);
  });

  var barCtx = $("chart-bar").getContext("2d");
  var bar = new Chart(barCtx, {
    type:"bar",
    data:{ labels:labels, datasets:[
      { label:"Pontuação obtida", data:vals, backgroundColor:colors, borderRadius:8, barPercentage:.7 },
      { label:"Máxima possível", data:maxs, backgroundColor:"rgba(255,255,255,.12)", borderRadius:8, barPercentage:.7 }
    ]},
    options:{
      indexAxis:"y", responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ position:"bottom", labels:{boxWidth:14, boxHeight:14} },
        tooltip:{ callbacks:{ label:function(ctx){ return ctx.dataset.label + ": " + ctx.raw + (ctx.datasetIndex === 0 && maxs[ctx.dataIndex] ? " (" + Math.round(ctx.raw/maxs[ctx.dataIndex]*100) + "%)" : ""); } } }
      },
      scales:{
        x:{ beginAtZero:true, grid:{color:"rgba(255,255,255,.06)"} },
        y:{ grid:{display:false}, ticks:{font:{size:11}} }
      }
    }
  });
  charts.push(bar);

  if (doughnutOK){
    var dCtx = $("chart-dough").getContext("2d");
    var dough = new Chart(dCtx, {
      type:"doughnut",
      data:{ labels:labels, datasets:[{ data:vals, backgroundColor:colors, borderColor:"#0a0a0c", borderWidth:3, hoverOffset:8 }]},
      options:{
        responsive:true, maintainAspectRatio:false, cutout:"58%",
        plugins:{
          legend:{ position:"bottom", labels:{boxWidth:14, boxHeight:14} },
          tooltip:{ callbacks:{ label:function(ctx){ return " " + ctx.label + ": " + ctx.raw + " pontos (" + Math.round(ctx.raw/r.total*100) + "% da pontuação)"; } } }
        }
      }
    });
    charts.push(dough);
  }
}

/* ---------- compartilhar / exportar ---------- */
function shareResult(L){
  var r = L.result;
  var text = "Meu resultado no Sinais Ocultos — " + L.test.title + ": " + r.total + "/" + r.totalMax +
             ' pontos ("' + r.band.title + '"). Teste de reflexão, sem diagnóstico. Refaça em: ' + location.href.split("#")[0];
  if (navigator.share){
    navigator.share({ title:"Sinais Ocultos — resultado", text:text, url:location.href }).catch(function(){});
  } else {
    copyText(text);
  }
}
function copyText(text){
  function fb(){
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Resumo copiado!"); }catch(e){ toast("Não foi possível copiar automaticamente."); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast("Resumo copiado!"); }, fb);
  } else fb();
}

function savePNG(canvasId, filename){
  var cv = $(canvasId);
  if (!cv || typeof Chart === "undefined"){ toast("Gráfico indisponível para exportação."); return; }
  var chart = charts.find(function(c){ return c.canvas === cv; });
  try{
    var url = chart ? chart.toBase64Image("image/png", 1) : cv.toDataURL("image/png");
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast("Imagem salva!");
  }catch(e){ toast("Não foi possível salvar a imagem."); }
}

function exportPDF(L){
  if (!window.jspdf || !window.jspdf.jsPDF){ toast("Biblioteca de PDF não carregada (verifique a internet)."); return; }
  var doc = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
  var r = L.result, test = L.test;
  var margin = 48, y = 60, pageW = doc.internal.pageSize.getWidth();

  function line(txt, size, gap, color){
    doc.setFontSize(size || 11);
    if (color) doc.setTextColor(color[0], color[1], color[2]); else doc.setTextColor(30,30,30);
    var lines = doc.splitTextToSize(txt, pageW - margin*2);
    lines.forEach(function(l){ if (y > 780){ doc.addPage(); y = 60; } doc.text(l, margin, y); y += (gap || 16); });
  }
  function section(t){ y += 10; line(t, 13, 18, [168,28,46]); }

  doc.setFont("helvetica","bold");
  line("Sinais Ocultos — Resultado do Teste", 18, 22, [122,18,32]);
  doc.setFont("helvetica","normal");
  line("Teste: " + test.title, 12, 16);
  line("Data de realização: " + fmtDate(r.dateISO), 10, 16, [110,110,110]);
  line("Pontuação total: " + r.total + " de " + r.totalMax + " pontos — " + r.band.title, 12, 18);
  line("Aviso: resultado gerado por teste de autorreflexão. Não é diagnóstico nem prova de infidelidade.", 9, 18, [110,110,110]);

  section("Pontuações por categoria");
  r.sorted.forEach(function(c){
    line("• " + c.name + ": " + (c.pct === null ? "Sem dados" : c.score + "/" + c.max + " (" + c.pct + "%) — " + interpLabel(c.pct)), 10, 15);
  });

  // gráficos como imagem
  ["chart-bar","chart-dough"].forEach(function(id, k){
    var cv = $(id); if (!cv) return;
    var chart = charts.find(function(c){ return c.canvas === cv; });
    try{
      var img = chart ? chart.toBase64Image("image/png", 1) : null;
      if (img){
        if (y > 560){ doc.addPage(); y = 60; }
        doc.addImage(img, "PNG", margin, y, pageW - margin*2, 220);
        y += 236;
      }
    }catch(e){}
  });

  if (y > 620){ doc.addPage(); y = 60; }
  section("Interpretação e dicas");
  line(r.band.msg, 10, 15);
  r.tips.forEach(function(t, i){ line((i+1) + ". " + t, 10, 15); });
  section("Perguntas para reflexão");
  r.refl.forEach(function(t, i){ line((i+1) + ". " + t, 10, 15); });
  y += 8;
  line("Documento gerado pelo próprio usuário. Nenhum dado pessoal foi incluído automaticamente.", 8, 12, [110,110,110]);

  doc.save("sinais-ocultos-resultado.pdf");
  toast("PDF gerado!");
}

router();
